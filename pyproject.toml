[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantized-teacher-opd"
version = "0.1.0"
description = "Quantized-teacher on-policy distillation experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.4,<2",
  "bitsandbytes>=0.48,<1",
  "datasets>=4.7,<5",
  "huggingface-hub>=0.35,<2",
  "math-verify[antlr4_13_2]>=0.9,<1",
  "safetensors>=0.5,<1",
  "torch>=2.7,<3",
  "transformers>=4.56.2,<6",
  "trl==1.6.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.12,<=0.19; sys_platform == 'linux'"]

[project.scripts]
opd-check-env = "opd.env_check:main"
opd-prepare-data = "opd.prepare_data:main"
opd-diagnose = "opd.diagnostics:main"
opd-eval = "opd.evaluate:main"
opd-trajectories = "opd.trajectories:main"
opd-score = "opd.score:main"
opd-train = "opd.train_opd:main"
opd-report = "opd.report:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
# The GPU server is x86_64 Linux; the lock is often regenerated from a non-Linux dev machine.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# xgrammar 0.2.4 is a broken release: it published 13 files instead of the usual 35 and ships no
# cp312 Linux x86_64 wheel, so `uv sync --extra vllm` fails on a Python 3.12 x86_64 server. Its
# cp311 x86_64 wheel does exist, which is enough to satisfy required-environments above -- hence
# the explicit exclusion. vLLM 0.19 asks only for xgrammar>=0.1.32,<1.0.0, so 0.2.3 is fine.
constraint-dependencies = ["xgrammar!=0.2.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/opd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

